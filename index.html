    <style>
        body {
            background-color: #07090E;
            color: #F3F4F6;
            font-family: 'Inter', sans-serif;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.08) 0%, transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(245, 158, 11, 0.05) 0%, transparent 25%);
            background-attachment: fixed;
        }

        .glass-panel {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card {
            background: linear-gradient(135deg, rgba(31, 41, 55, 0.6) 0%, rgba(17, 24, 39, 0.8) 100%);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(245, 158, 11, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .gold-gradient-text {
            background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 50%, #D97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-gradient-bg {
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(17, 24, 39, 0.5);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(75, 85, 99, 0.5);
            border-radius: 3px;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.3); }
            50% { box-shadow: 0 0 30px rgba(245, 158, 11, 0.6); }
        }
        .case-opening-box {
            animation: pulse-glow 1.5s infinite;
        }

        .case-spinner-container {
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 130px;
            background: rgba(3, 7, 18, 0.9);
            border-radius: 1rem;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        .case-spinner-pointer {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 4px;
            background: #F59E0B;
            transform: translateX(-50%);
            z-index: 20;
            box-shadow: 0 0 12px #F59E0B;
        }
        .case-spinner-pointer::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 10px solid #F59E0B;
        }
        .case-spinner-track {
            display: flex;
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            will-change: transform;
            transition: transform 5s cubic-bezier(0.15, 0.9, 0.2, 1);
        }
        .case-item-card {
            min-width: 120px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding: 0 10px;
        }
    </style>
</head>

    <script>
        const SUPABASE_URL = "https://gnzhgavbvkjvoeslrlns.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_e84AiBuFrqji-bPqqbsbaA_woYYU8dx";
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const myWalletAddress = "TLCairnHMb79V8js1SKgK4iUEMgHnN4SUM"; 

        let currentUser = null;
        let userProfile = null;
        let activeTab = 'dashboard';
        let userPackagesList = [];

        const AVAILABLE_PACKAGES = [
            { id: 'Little Investor', name: 'Little Investor', price: 20, daily: 0.99, desc: 'იდეალური სტარტი დამწყებთათვის.', color: 'from-blue-500/20 to-indigo-500/5' },
            { id: '9-5 Job', name: '9-5 Job', price: 60, daily: 3.99, desc: 'გამოიმუშავე ყოველდღიურად სტაბილური შემოსავალი.', color: 'from-cyan-500/20 to-blue-500/5' },
            { id: 'Normal Investor', name: 'Normal Investor', price: 199, daily: 22.90, desc: 'მყარი პაკეტი სერიოზული შემოსავლისთვის.', color: 'from-amber-500/20 to-orange-500/5' },
            { id: 'Big Boy', name: 'Big Boy', price: 399, daily: 44.90, desc: 'აიყვანე შენი პორტფოლიო ახალ დონეზე.', color: 'from-purple-500/20 to-pink-500/5' },
            { id: 'Boss', name: 'Boss', price: 999, daily: 119.00, desc: 'მაქსიმალური მოგება და პრივილეგიები.', color: 'from-emerald-500/20 to-teal-500/5' }
        ];

        const MULTIPLIERS = [
            { label: 'Common 1.0x', mult: 1.0, color: 'text-gray-400', bg: 'bg-gray-800' },
            { label: 'Rare 1.5x', mult: 1.5, color: 'text-blue-400', bg: 'bg-blue-900/40' },
            { label: 'Epic 2.0x', mult: 2.0, color: 'text-purple-400', bg: 'bg-purple-900/40' },
            { label: 'Legendary 3.0x', mult: 3.0, color: 'text-amber-400', bg: 'bg-amber-900/40' }
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const refFromUrl = urlParams.get('ref');
        if (refFromUrl) localStorage.setItem('invited_by', refFromUrl);

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const { data: { session } } = await db.auth.getSession();
                if (session) {
                    currentUser = session.user;
                    await fetchProfile();
                    await fetchUserPackages();
                    renderMainDashboard();
                } else {
                    const hasRef = localStorage.getItem('invited_by');
                    renderAuthPage(hasRef ? true : false);
                }
            } catch (err) {
                console.error("Initialization error:", err);
                renderAuthPage(false);
            }
        });

        async function fetchProfile() {
            if (!currentUser) return;
            const { data } = await db.from('profiles').select('*').eq('id', currentUser.id).single();
            if (data) userProfile = data;
        }

        async function fetchUserPackages() {
            if (!currentUser) return;
            const { data, error } = await db.from('user_packages').select('*').eq('user_id', currentUser.id);
            if (error) userPackagesList = [];
            else userPackagesList = data || [];
        }

        function renderAuthPage(isSignUp = false) {
            const navRight = document.getElementById('navRight');
            navRight.innerHTML = `
                <button onclick="renderAuthPage(false)" class="text-sm font-medium text-gray-300 hover:text-white px-3 py-2">შესვლა</button>
                <button onclick="renderAuthPage(true)" class="text-sm font-semibold text-black gold-gradient-bg px-4 py-2 rounded-lg hover:brightness-110 transition shadow-md">რეგისტრაცია</button>
            `;

            const savedRef = localStorage.getItem('invited_by') || '';
            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="max-w-md mx-auto my-12 glass-panel p-8 rounded-2xl shadow-2xl border border-gray-800">
                    <div class="text-center mb-8">
                        <h2 class="text-2xl font-bold font-display text-white">${isSignUp ? 'ანგარიშის შექმნა' : 'ავტორიზაცია'}</h2>
                        <p class="text-sm text-gray-400 mt-2">${isSignUp ? 'შეუერთდი საინვესტიციო პლატფორმას' : 'მართე შენი პორტფოლიო'}</p>
                    </div>

                    <form onsubmit="handleAuth(event, ${isSignUp})" class="space-y-5">
                        ${isSignUp ? `
                            <div>
                                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">სრული სახელი</label>
                                <input type="text" id="fullName" required class="w-full bg-gray-900 border border-gray-700 rounded-xl py-3 px-4 text-white focus:outline-none focus:border-amber-500 text-sm">
                            </div>
                        ` : ''}

                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">ელ.ფოსტა</label>
                            <input type="email" id="email" required class="w-full bg-gray-900 border border-gray-700 rounded-xl py-3 px-4 text-white focus:outline-none focus:border-amber-500 text-sm">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">პაროლი</label>
                            <input type="password" id="password" required class="w-full bg-gray-900 border border-gray-700 rounded-xl py-3 px-4 text-white focus:outline-none focus:border-amber-500 text-sm">
                        </div>

                        ${isSignUp ? `
                            <div>
                                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">რეფერალური კოდი</label>
                                <input type="text" id="refCode" value="${savedRef}" class="w-full bg-gray-900 border border-amber-500/50 rounded-xl py-3 px-4 text-amber-400 font-bold focus:outline-none focus:border-amber-500 text-sm">
                            </div>
                        ` : ''}

                        <button type="submit" class="w-full gold-gradient-bg text-black font-bold py-3.5 px-4 rounded-xl hover:brightness-110 transition shadow-lg text-sm mt-2">
                            ${isSignUp ? 'რეგისტრაცია' : 'შესვლა'}
                        </button>
                    </form>

                    <div class="mt-6 text-center text-sm text-gray-400">
                        ${isSignUp ? 'უკვე გაქვს ანგარიში?' : 'არ გაქვს ანგარიში?'}
                        <button onclick="renderAuthPage(${!isSignUp})" class="text-amber-500 hover:underline font-semibold ml-1">
                            ${isSignUp ? 'შესვლა' : 'რეგისტრაცია'}
                        </button>
                    </div>
                </div>
            `;
        }

        async function handleAuth(e, isSignUp) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (isSignUp) {
                const fullName = document.getElementById('fullName').value;
                const refCode = document.getElementById('refCode').value || null;

                const { data, error } = await db.auth.signUp({
                    email,
                    password,
                    options: { data: { full_name: fullName, referred_by: refCode } }
                });

                if (error) alert(error.message);
                else {
                    localStorage.removeItem('invited_by');
                    alert("რეგისტრაცია წარმატებით გაიარე!");
                    location.reload();
                }
            } else {
                const { data, error } = await db.auth.signInWithPassword({ email, password });
                if (error) alert(error.message);
                else location.reload();
            }
        }

        async function handleLogout() {
            await db.auth.signOut();
            location.reload();
        }

                        ${(userProfile?.full_name || 'U').charAt(0)}

                    <span class="text-sm font-medium text-gray-200 hidden sm:inline">${userProfile?.full_name || currentUser.email}</span>
                </div>
                <button onclick="handleLogout()" class="text-gray-400 hover:text-red-400 p-2 rounded-lg hover:bg-gray-800/50 transition">
                    <i class="fa-solid fa-right-from-bracket text-lg"></i>
                </button>
            `;

            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="flex border-b border-gray-800 mb-8 space-x-2 overflow-x-auto pb-1 custom-scrollbar">
                    <button onclick="switchTab('dashboard')" id="tab-dashboard" class="px-5 py-3 font-medium text-sm rounded-xl transition flex items-center space-x-2 whitespace-nowrap bg-amber-500/10 text-amber-500 border border-amber-500/20">
                        <i class="fa-solid fa-chart-pie"></i><span>დეშბორდი</span>
                    </button>
                    <button onclick="switchTab('packages')" id="tab-packages" class="px-5 py-3 font-medium text-sm rounded-xl transition flex items-center space-x-2 whitespace-nowrap text-gray-400 hover:bg-gray-800/50 hover:text-gray-200">
                        <i class="fa-solid fa-box-open"></i><span>პაკეტები</span>
                    </button>
                </div>
                <div id="tabContent"></div>
            `;

            loadDashboardTab();
        }

        function switchTab(tab) {
            activeTab = tab;
            ['dashboard', 'packages'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (!btn) return;
                if (t === tab) btn.className = "px-5 py-3 font-medium text-sm rounded-xl transition flex items-center space-x-2 whitespace-nowrap bg-amber-500/10 text-amber-500 border border-amber-500/20 shadow-sm";
                else btn.className = "px-5 py-3 font-medium text-sm rounded-xl transition flex items-center space-x-2 whitespace-nowrap text-gray-400 hover:bg-gray-800/50 hover:text-gray-200";
            });

            if (tab === 'dashboard') loadDashboardTab();
            if (tab === 'packages') loadPackagesTab();
        }

            await fetchUserPackages();

            if (lastClaim) {

                if (diffMs < sixHoursMs) {
                    canClaim = false;
                    remainingMs = sixHoursMs - diffMs;

            }

            content.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="glass-card p-6 rounded-2xl relative overflow-hidden">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">ბალანსი</p>
                                <h3 class="text-3xl font-extrabold font-display text-white mt-2">$${(userProfile?.balance || 0).toFixed(2)}</h3>
                            </div>
                            <div class="w-12 h-12 rounded-xl bg-amber-500/10 text-amber-500 flex items-center justify-center text-xl">
                                <i class="fa-solid fa-wallet"></i>
                            </div>
                        </div>
                        <div class="mt-4 pt-4 border-t border-gray-800 flex space-x-3">
                            <button onclick="openDepositModal()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-black font-semibold py-2 rounded-lg text-xs transition">დეპოზიტი</button>
                            <button onclick="openWithdrawModal()" class="flex-1 bg-gray-800 hover:bg-gray-700 text-white font-semibold py-2 rounded-lg text-xs transition border border-gray-700">გატანა</button>
                        </div>
                    </div>

                    <div class="glass-card p-6 rounded-2xl">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">სულ გამომუშავებული</p>
                                <h3 class="text-3xl font-extrabold font-display text-emerald-400 mt-2">$${(userProfile?.total_earned || 0).toFixed(2)}</h3>

                            <span id="claimTimerDisplay" class="text-xs text-gray-400">${canClaim ? 'ქეისი ხელმისაწვდომია!' : 'მომდევნო ქეისი მალე'}</span>
                            <button id="claimCaseMainBtn" onclick="openCaseClaimModal()" ${!canClaim || userPackagesList.length === 0 ? 'disabled' : ''} class="${canClaim && userPackagesList.length > 0 ? 'bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 hover:bg-emerald-500 hover:text-black shadow-emerald-500/10' : 'bg-gray-800 text-gray-500 border border-gray-700 cursor-not-allowed'} font-semibold px-3 py-1.5 rounded-lg text-xs transition shadow-lg">
                                ${canClaim ? 'ქეისის გახსნა' : 'ლოდინი...'}

                    ${!userPackagesList || userPackagesList.length === 0 ? `

                    `}

            `;

            if (!canClaim && remainingMs > 0) startCountdownTimer(remainingMs);
        }

        function loadPackagesTab() {
            const content = document.getElementById('tabContent');
            content.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    ${AVAILABLE_PACKAGES.map(pkg => `
                        <div class="glass-card p-6 rounded-2xl flex flex-col justify-between border border-gray-800">

                                <p class="text-xs text-gray-400 leading-relaxed mb-4">${pkg.desc}</p>
                                <div class="bg-gray-900/80 p-3 rounded-xl mb-4 border border-gray-800/80">
                                    <span class="text-xs text-gray-400">დღიური მოგება:</span>
                                    <span class="text-sm font-bold text-emerald-400 float-right">$${pkg.daily}</span>
                                </div>
                            </div>
                            <button onclick="buyPackage('${pkg.name}', ${pkg.price})" class="w-full gold-gradient-bg text-black font-bold py-3 rounded-xl text-xs hover:brightness-110 transition shadow-lg">
                                პაკეტის ყიდვა
                            </button>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        async function buyPackage(pkgName, price) {
            if ((userProfile?.balance || 0) < price) {
                alert("ბალანსზე არ არის საკმარისი თანხა!");
                return;
            }

            const newBalance = userProfile.balance - price;
            const { error: balanceErr } = await db.from('profiles').update({ balance: newBalance }).eq('id', currentUser.id);
            if (balanceErr) return alert("შეცდომა ბალანსის ჩამოჭრისას.");

            const { error: pkgErr } = await db.from('user_packages').insert([{
                user_id: currentUser.id,
                package_name: pkgName,
                amount: price
            }]);

            if (pkgErr) alert("შეცდომა პაკეტის გააქტიურებისას.");
            else {
                alert("პაკეტი წარმატებით გააქტიურდა!");
                await fetchProfile();
                await fetchUserPackages();
                switchTab('dashboard');
            }
        }

        function startCountdownTimer(durationMs) {
            let timeLeft = durationMs;
            const timerDisplay = document.getElementById('claimTimerDisplay');
            const claimBtn = document.getElementById('claimCaseMainBtn');

            const interval = setInterval(() => {
                timeLeft -= 1000;
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    if (timerDisplay) timerDisplay.innerText = 'ქეისი ხელმისაწვდომია!';
                    if (claimBtn && userPackagesList.length > 0) {
                        claimBtn.disabled = false;
                        claimBtn.className = 'bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 hover:bg-emerald-500 hover:text-black font-semibold px-3 py-1.5 rounded-lg text-xs transition shadow-lg';
                        claimBtn.innerText = 'ქეისის გახსნა';
                    }
                    return;
                }

                const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

                if (timerDisplay) timerDisplay.innerText = `შემდეგი ქეისი: ${hours}სთ ${minutes}წთ ${seconds}წმ`;
            }, 1000);
        }

        function openCaseClaimModal() {
            if (!userPackagesList || userPackagesList.length === 0) {
                alert("შემოსავლის მისაღებად საჭიროა გქონდეს აქტიური პაკეტი!");
                return;
            }

            let totalDailySum = 0;
            userPackagesList.forEach(up => {
                const matchedPkg = AVAILABLE_PACKAGES.find(p => p.name.trim().toLowerCase() === up.package_name.trim().toLowerCase());
                totalDailySum += matchedPkg ? matchedPkg.daily : 1.0;
            });

            const baseSixHourAmount = totalDailySum / 4;

            const modalHtml = `
                <div id="caseModalOverlay" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
                    <div class="glass-panel max-w-xl w-full p-8 rounded-2xl border border-amber-500/40 text-center case-opening-box relative">
                        <button onclick="closeModal('caseModalOverlay')" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                        <div class="w-14 h-14 rounded-2xl bg-amber-500/20 text-amber-400 flex items-center justify-center mx-auto text-xl mb-3">
                            <i class="fa-solid fa-box-open animate-bounce"></i>
                        </div>
                        <h3 class="text-xl font-bold text-white mb-1 font-display">6-საათიანი ქეისის გახსნა</h3>
                        <p class="text-xs text-gray-400 mb-6">ამოიღე შენი ბონუს მულტიპლიკატორი (Common 1.0x, Rare 1.5x, Epic 2.0x, Legendary 3.0x)!</p>
                        
                        <div class="case-spinner-container mb-6 shadow-inner">
                            <div class="case-spinner-pointer"></div>
                            <div id="spinnerTrack" class="case-spinner-track"></div>
                        </div>

                        <div id="caseResultInfo" class="text-sm font-semibold text-gray-400 uppercase tracking-widest mb-6 h-6">
                            მზადაა გასახსნელად
                        </div>

                        <button id="spinCaseBtn" onclick="spinAndClaimCase(${baseSixHourAmount})" class="w-full gold-gradient-bg text-black font-bold py-3.5 rounded-xl transition text-sm shadow-lg shadow-amber-500/20">
                            ქეისის დატრიალება
                        </button>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            buildSpinnerItems();
        }

        let generatedItems = [];
        function buildSpinnerItems() {
            const track = document.getElementById('spinnerTrack');
            if (!track) return;

            generatedItems = [];
            track.innerHTML = '';

            for (let i = 0; i < 60; i++) {
                const rand = Math.random();
                let selected = MULTIPLIERS[0];
                if (rand > 0.6) selected = MULTIPLIERS[1];
                if (rand > 0.85) selected = MULTIPLIERS[2];
                if (rand > 0.96) selected = MULTIPLIERS[3];

                generatedItems.push(selected);

                const itemCard = document.createElement('div');
                itemCard.className = `case-item-card ${selected.bg}`;
                itemCard.innerHTML = `
                    <i class="fa-solid fa-gem ${selected.color} text-2xl mb-1"></i>
                    <span class="text-xs font-bold ${selected.color}">${selected.label}</span>
                `;
                track.appendChild(itemCard);
            }
        }

        async function spinAndClaimCase(baseAmount) {
            const btn = document.getElementById('spinCaseBtn');
            const track = document.getElementById('spinnerTrack');
            const resultInfo = document.getElementById('caseResultInfo');
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');

            const winningIndex = Math.floor(Math.random() * 10) + 40;
            const targetItem = generatedItems[winningIndex];

            const itemWidth = 120;
            const containerWidth = track.parentElement.offsetWidth;
            const targetOffset = (winningIndex * itemWidth) - (containerWidth / 2) + (itemWidth / 2);

            track.style.transform = `translateX(-${targetOffset}px)`;

            setTimeout(async () => {
                const reward = baseAmount * targetItem.mult;
                resultInfo.innerHTML = `<span class="${targetItem.color}">მოიგე ${targetItem.label}! დაგერიცხა: $${reward.toFixed(2)}</span>`;

                const now = new Date().toISOString();
                const newBalance = (userProfile?.balance || 0) + reward;
                const newTotalEarned = (userProfile?.total_earned || 0) + reward;

                await db.from('profiles').update({
                    balance: newBalance,
                    total_earned: newTotalEarned,
                    last_claim_at: now
                }).eq('id', currentUser.id);

                await fetchProfile();

                setTimeout(() => {
                    closeModal('caseModalOverlay');
                    loadDashboardTab();
                }, 2000);
            }, 5000);
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            if (modal) modal.remove();
        }

        function openDepositModal() {
            const modalHtml = `
                <div id="depositModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="glass-panel max-w-md w-full p-6 rounded-2xl border border-gray-800 relative">
                        <button onclick="closeModal('depositModal')" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                        <h3 class="text-lg font-bold text-white mb-2">დეპოზიტის შევსება</h3>
                        <p class="text-xs text-gray-400 mb-4">გადარიცხეთ USDT (TRC20) მისამართზე:</p>
                        <div class="bg-gray-900 p-3 rounded-xl border border-gray-800 text-xs font-mono text-amber-400 flex justify-between items-center mb-4">
                            <span class="truncate">${myWalletAddress}</span>
                            <button onclick="navigator.clipboard.writeText('${myWalletAddress}'); alert('მისამართი დაკოპირდა!')" class="ml-2 text-gray-400 hover:text-white"><i class="fa-regular fa-copy"></i></button>
                        </div>
                        <button onclick="closeModal('depositModal')" class="w-full bg-amber-500 text-black font-bold py-2.5 rounded-xl text-xs">დახურვა</button>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }

        function openWithdrawModal() {
            const modalHtml = `
                <div id="withdrawModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="glass-panel max-w-md w-full p-6 rounded-2xl border border-gray-800 relative">
                        <button onclick="closeModal('withdrawModal')" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                        <h3 class="text-lg font-bold text-white mb-4">თანხის გატანა</h3>
                        <input type="number" id="withdrawAmount" placeholder="თანხა ($)" class="w-full bg-gray-900 border border-gray-700 rounded-xl py-2.5 px-3 text-white text-xs mb-3 focus:outline-none focus:border-amber-500">
                        <input type="text" id="withdrawAddress" placeholder="TRC20 Wallet Address" class="w-full bg-gray-900 border border-gray-700 rounded-xl py-2.5 px-3 text-white text-xs mb-4 focus:outline-none focus:border-amber-500">
                        <button onclick="handleWithdraw()" class="w-full bg-amber-500 text-black font-bold py-2.5 rounded-xl text-xs">მოთხოვნა</button>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }

        async function handleWithdraw() {
            const amount = parseFloat(document.getElementById('withdrawAmount').value);
            const address = document.getElementById('withdrawAddress').value;

            if (!amount || amount <= 0 || !address) return alert("შეავსეთ ყველა ველი სწორად!");
            if (amount > (userProfile?.balance || 0)) return alert("არასაკმარისი ბალანსი!");

            const newBalance = userProfile.balance - amount;
            await db.from('profiles').update({ balance: newBalance }).eq('id', currentUser.id);

            alert("გატანის მოთხოვნა მიღებულია!");
            closeModal('withdrawModal');
            await fetchProfile();
            loadDashboardTab();
        }
    </script>
</body>
</html>
