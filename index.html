<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capital Investment Platform - Case Opening Edition</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#0B0F19',
                            card: '#111827',
                            border: '#1F2937',
                            accent: '#3B82F6',
                            gold: '#F59E0B',
                            goldHover: '#D97706',
                            green: '#10B981',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #07090E;
            color: #F3F4F6;
            font-family: 'Inter', sans-serif;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.08) 0%, transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(245, 158, 11, 0.05) 0%, transparent 25%);
            background-attachment: fixed;
        }
        .glass-panel {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: linear-gradient(135deg, rgba(31, 41, 55, 0.6) 0%, rgba(17, 24, 39, 0.8) 100%);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            border-color: rgba(245, 158, 11, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.5);
        }
        .gold-gradient-text {
            background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 50%, #D97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-gradient-bg {
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(17, 24, 39, 0.5); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(75, 85, 99, 0.5); border-radius: 3px; }
        
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.3); }
            50% { box-shadow: 0 0 30px rgba(245, 158, 11, 0.6); }
        }
        .case-opening-box { animation: pulse-glow 1.5s infinite; }
        .case-spinner-container {
            position: relative; overflow: hidden; width: 100%; height: 130px;
            background: rgba(3, 7, 18, 0.9); border-radius: 1rem; border: 1px solid rgba(245, 158, 11, 0.3);
        }
        .case-spinner-pointer {
            position: absolute; top: 0; bottom: 0; left: 50%; width: 4px;
            background: #F59E0B; transform: translateX(-50%); z-index: 20; box-shadow: 0 0 12px #F59E0B;
        }
        .case-spinner-track { display: flex; position: absolute; left: 0; top: 0; height: 100%; will-change: transform; }
        .case-item-card { min-width: 120px; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; border-right: 1px solid rgba(255, 255, 255, 0.05); padding: 0 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between custom-scrollbar">

    <!-- TOP NAVIGATION -->
    <nav class="glass-panel sticky top-0 z-50 border-b border-gray-800/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl gold-gradient-bg flex items-center justify-center shadow-lg shadow-amber-500/20">
                        <i class="fa-solid fa-chart-line text-black font-bold text-xl"></i>
                    </div>
                    <div>
                        <span class="font-display font-bold text-xl tracking-tight text-white block">CAPITAL<span class="gold-gradient-text">INV</span></span>
                        <span class="text-[10px] text-gray-400 tracking-widest uppercase block -mt-1">Crypto Yield Platform</span>
                    </div>
                </div>
                <div id="navRight" class="flex items-center space-x-4"></div>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTAINER -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        <div id="appContainer"></div>
    </main>

    <!-- FOOTER -->
    <footer class="glass-panel border-t border-gray-800/60 py-6 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm text-gray-500 flex flex-col sm:flex-row justify-between items-center gap-4">
            <p>© 2026 Capital Investment Platform. All rights reserved.</p>
            <div class="flex space-x-6 text-gray-400">
                <a href="#" class="hover:text-amber-500 transition"><i class="fa-brands fa-telegram text-lg"></i></a>
                <a href="#" class="hover:text-amber-500 transition"><i class="fa-brands fa-twitter text-lg"></i></a>
                <a href="#" class="hover:text-amber-500 transition"><i class="fa-solid fa-headset text-lg"></i></a>
            </div>
        </div>
    </footer>

    <!-- JS SCRIPT CORE -->
    <script>
        const SUPABASE_URL = "https://gnzhgavbvkjvoeslrlns.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_e84AiBuFrqji-bPqqbsbaA_woYYU8dx";
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const myWalletAddress = "TLCairnHMb79V8js1SKgK4iUEMgHnN4SUM"; 

        let currentUser = null;
        let userProfile = null;
        let activeTab = 'dashboard';
        let userPackagesList = [];

        const AVAILABLE_PACKAGES = [
            { id: 'Little Investor', name: 'Little Investor', price: 20, daily: 0.99, desc: 'იდეალური სტარტი დამწყებთათვის.', color: 'from-blue-500/20 to-indigo-500/5' },
            { id: '9-5 Job', name: '9-5 Job', price: 60, daily: 3.99, desc: 'სტაბილური შემოსავალი ყოველდღიურად.', color: 'from-cyan-500/20 to-blue-500/5' },
            { id: 'Normal Investor', name: 'Normal Investor', price: 199, daily: 22.90, desc: 'მყარი პაკეტი სერიოზული შემოსავლისთვის.', color: 'from-amber-500/20 to-orange-500/5' },
            { id: 'Big Boy', name: 'Big Boy', price: 399, daily: 44.90, desc: 'მაღალი შემოსავალი შენი პორტფოლიოსთვის.', color: 'from-purple-500/20 to-pink-500/5' },
            { id: 'Boss', name: 'Boss', price: 999, daily: 119.00, desc: 'ელიტარული სტატუსი მაქსიმალური მოგებით.', color: 'from-emerald-500/20 to-teal-500/5' }
        ];

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const { data: { session } } = await db.auth.getSession();
                if (session) {
                    currentUser = session.user;
                    await fetchProfile();
                    await fetchUserPackages();
                    renderMainDashboard();
                } else {
                    renderAuthPage(false);
                }
            } catch (err) {
                console.error("Init error:", err);
                renderAuthPage(false);
            }
        });

        async function fetchProfile() {
            if (!currentUser) return;
            const { data } = await db.from('profiles').select('*').eq('id', currentUser.id).single();
            if (data) userProfile = data;
        }

        async function fetchUserPackages() {
            if (!currentUser) return;
            const { data, error } = await db.from('user_packages').select('*').eq('user_id', currentUser.id);
            if (error) {
                console.error("Error fetching packages:", error);
                userPackagesList = [];
            } else {
                userPackagesList = data || [];
            }
        }

        function renderAuthPage(isSignUp = false) {
            document.getElementById('navRight').innerHTML = `
                <button onclick="renderAuthPage(false)" class="text-sm font-medium text-gray-300 hover:text-white px-3 py-2">შესვლა</button>
                <button onclick="renderAuthPage(true)" class="text-sm font-semibold text-black gold-gradient-bg px-4 py-2 rounded-lg">რეგისტრაცია</button>
            `;
            document.getElementById('appContainer').innerHTML = `
                <div class="max-w-md mx-auto my-12 glass-panel p-8 rounded-2xl shadow-2xl border border-gray-800">
                    <h2 class="text-2xl font-bold font-display text-white mb-6 text-center">${isSignUp ? 'რეგისტრაცია' : 'შესვლა'}</h2>
                    <form onsubmit="handleAuth(event, ${isSignUp})" class="space-y-4">
                        ${isSignUp ? `<div><label class="block text-xs text-gray-400 mb-1">სახელი</label><input type="text" id="fullName" required class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-sm text-white"></div>` : ''}
                        <div><label class="block text-xs text-gray-400 mb-1">ელ-ფოსტა</label><input type="email" id="email" required class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-sm text-white"></div>
                        <div><label class="block text-xs text-gray-400 mb-1">პაროლი</label><input type="password" id="password" required class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-sm text-white"></div>
                        <button type="submit" class="w-full gold-gradient-bg text-black font-bold py-3 rounded-xl text-sm mt-2">${isSignUp ? 'რეგისტრაცია' : 'შესვლა'}</button>
                    </form>
                </div>
            `;
        }

        async function handleAuth(e, isSignUp) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if (isSignUp) {
                const fullName = document.getElementById('fullName').value;
                const { error } = await db.auth.signUp({ email, password, options: { data: { full_name: fullName } } });
                if (error) alert(error.message);
                else { alert("რეგისტრაცია წარმატებულია!"); location.reload(); }
            } else {
                const { error } = await db.auth.signInWithPassword({ email, password });
                if (error) alert(error.message);
                else location.reload();
            }
        }

        async function handleLogout() {
            await db.auth.signOut();
            location.reload();
        }

        function renderMainDashboard() {
            document.getElementById('navRight').innerHTML = `
                <span class="text-sm text-gray-300 hidden sm:inline">${userProfile?.full_name || currentUser.email}</span>
                <button onclick="handleLogout()" class="text-gray-400 hover:text-red-400 p-2"><i class="fa-solid fa-right-from-bracket text-lg"></i></button>
            `;
            document.getElementById('appContainer').innerHTML = `
                <div class="flex border-b border-gray-800 mb-8 space-x-2 overflow-x-auto pb-1">
                    <button onclick="switchTab('dashboard')" id="tab-dashboard" class="px-5 py-3 font-medium text-sm rounded-xl bg-amber-500/10 text-amber-500 border border-amber-500/20">დეშბორდი</button>
                    <button onclick="switchTab('packages')" id="tab-packages" class="px-5 py-3 font-medium text-sm rounded-xl text-gray-400 hover:bg-gray-800/50">პაკეტები</button>
                </div>
                <div id="tabContent"></div>
            `;
            loadDashboardTab();
        }

        async function switchTab(tab) {
            activeTab = tab;
            await fetchUserPackages(); // განახლება ტაბის გადართვისას
            ['dashboard', 'packages'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (btn) btn.className = t === tab ? "px-5 py-3 font-medium text-sm rounded-xl bg-amber-500/10 text-amber-500 border border-amber-500/20" : "px-5 py-3 font-medium text-sm rounded-xl text-gray-400 hover:bg-gray-800/50";
            });
            if (tab === 'dashboard') loadDashboardTab();
            if (tab === 'packages') loadPackagesTab();
        }

        async function loadDashboardTab() {
            await fetchUserPackages();
            document.getElementById('tabContent').innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="glass-card p-6 rounded-2xl">
                        <p class="text-xs text-gray-400 uppercase">ბალანსი</p>
                        <h3 class="text-3xl font-extrabold text-white mt-2">$${(userProfile?.balance || 0).toFixed(2)}</h3>
                    </div>
                    <div class="glass-card p-6 rounded-2xl">
                        <p class="text-xs text-gray-400 uppercase">სულ გამომუშავებული</p>
                        <h3 class="text-3xl font-extrabold text-emerald-400 mt-2">$${(userProfile?.total_earned || 0).toFixed(2)}</h3>
                    </div>
                </div>
                <div class="glass-panel p-6 rounded-2xl border border-gray-800">
                    <h3 class="text-lg font-bold text-white mb-4">ჩემი აქტიური პაკეტები</h3>
                    ${userPackagesList.length === 0 ? '<p class="text-sm text-gray-400">აქტიური პაკეტები არ გაქვს.</p>' : `
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${userPackagesList.map(up => `
                                <div class="bg-gray-900/60 p-4 rounded-xl border border-gray-800 flex justify-between items-center">
                                    <div>
                                        <h4 class="font-bold text-white">${up.package_name}</h4>
                                        <p class="text-xs text-gray-400 mt-1">ფასი: <span class="text-amber-400 font-semibold">$${up.amount}</span></p>
                                    </div>
                                    <span class="px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">აქტიურია</span>
                                </div>
                            `).join('')}
                        </div>
                    `}
                </div>
            `;
        }

        async function loadPackagesTab() {
            await fetchUserPackages();
            document.getElementById('tabContent').innerHTML = `
                <div class="mb-6"><h2 class="text-xl font-bold text-white">საინვესტიციო პაკეტები</h2></div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    ${AVAILABLE_PACKAGES.map(p => {
                        // მკაცრი შემოწმება სახელის მიხედვით
                        const isAlreadyActive = userPackagesList.some(up => 
                            up.package_name && up.package_name.trim().toLowerCase() === p.name.trim().toLowerCase()
                        );
                        return `
                            <div class="glass-card p-6 rounded-2xl border border-gray-800 flex flex-col justify-between">
                                <div>
                                    <div class="flex justify-between items-center mb-3">
                                        <h3 class="text-xl font-bold text-white">${p.name}</h3>
                                        <span class="text-xl font-extrabold text-amber-400">$${p.price}</span>
                                    </div>
                                    <p class="text-xs text-gray-400 mb-4">${p.desc}</p>
                                    <div class="bg-gray-900/50 p-3 rounded-xl border border-gray-800 mb-6">
                                        <div class="flex justify-between text-sm">
                                            <span class="text-gray-400">დღიური შემოსავალი:</span>
                                            <span class="text-emerald-400 font-bold">$${p.daily}</span>
                                        </div>
                                    </div>
                                </div>
                                <button onclick="confirmBuyPackage('${p.name}', ${p.price})" ${isAlreadyActive ? 'disabled' : ''} class="w-full ${isAlreadyActive ? 'bg-gray-800 text-gray-500 border border-gray-700 cursor-not-allowed' : 'gold-gradient-bg text-black font-bold'} py-3 rounded-xl text-sm">
                                    ${isAlreadyActive ? 'პაკეტი აქტიურია' : 'პაკეტის შეძენა'}
                                </button>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        async function confirmBuyPackage(packageName, price) {
            if ((userProfile?.balance || 0) < price) {
                alert("ბალანსზე არ გაქვს საკმარისი თანხა!");
                return;
            }

            const newBalance = userProfile.balance - price;
            
            // ვწერთ ბაზაში
            const { error: insertError } = await db.from('user_packages').insert([{
                user_id: currentUser.id,
                package_name: packageName,
                amount: price,
                status: 'active'
            }]);

            if (insertError) {
                alert("შეცდომა პაკეტის ყიდვისას: " + insertError.message);
                return;
            }

            // ვანახლებთ ბალანსს
            await db.from('profiles').update({ balance: newBalance }).eq('id', currentUser.id);

            alert("პაკეტი წარმატებით გააქტიურდა!");
            await fetchProfile();
            await fetchUserPackages();
            loadPackagesTab();
        }
    </script>
</body>
</html>
