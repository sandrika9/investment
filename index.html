        async function handleAuth(e, isSignUp) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (isSignUp) {
                const fullName = document.getElementById('fullName').value;
                const refCode = document.getElementById('refCode').value || localStorage.getItem('invited_by') || null;

                const { data, error } = await db.auth.signUp({
                    email,
                    password,
                    options: { data: { full_name: fullName, referred_by: refCode } }
                });

                if (error) alert(error.message);
                else {
                    localStorage.removeItem('invited_by');
                    alert("რეგისტრაცია წარმატებით გაიარე!");
                    location.reload();
                }
            } else {
                const { data, error } = await db.auth.signInWithPassword({ email, password });
                if (error) alert(error.message);
                else location.reload();
            }
        }

            await db.auth.signOut();

                        <!-- სრული ლინკი -->
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">შენი რეფერალური ლინკი</label>
                            <div class="flex space-x-2">
                                <input type="text" readonly value="${refLink}" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm text-gray-300 focus:outline-none">
                                <button onclick="navigator.clipboard.writeText('${refLink}'); alert('ლინკი დაკოპირდა!')" class="bg-amber-500 hover:bg-amber-600 text-black font-bold px-5 rounded-xl transition text-sm">
                                    კოპირება
                                </button>
                            </div>
                        </div>

                        <div class="pt-4 border-t border-gray-800 flex justify-around text-center">
                            <div>
                                <span class="text-2xl font-bold text-white block">${userProfile?.referral_count || 0}</span>
                                <span class="text-xs text-gray-500">მოწვეული</span>
                            </div>
                            <div>
                                <span class="text-2xl font-bold text-amber-500 block">$${(userProfile?.referral_earnings || 0).toFixed(2)}</span>
                                <span class="text-xs text-gray-500">გამომუშავებული</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function loadAdminTab() {
            const content = document.getElementById('tabContent');
            content.innerHTML = `<div class="glass-card p-6 rounded-2xl text-center text-gray-400">ადმინ პანელი მალე დაემატება</div>`;
        }

        function openDepositModal() {
            const modalHtml = `
                <div id="modalOverlay" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                    <div class="glass-panel max-w-md w-full p-6 rounded-2xl border border-gray-800">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-lg font-bold text-white">USDT TRC20 დეპოზიტი</h3>
                            <button onclick="closeModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <p class="text-xs text-gray-400 mb-4">გადმორიცხეთ სასურველი თანხა მითითებულ მისამართზე და შეიყვანეთ ტრანზაქციის TXID:</p>
                        <div class="bg-gray-900/90 p-3 rounded-xl border border-gray-800 mb-4 flex justify-between items-center">
                            <span class="text-xs font-mono text-amber-400 truncate mr-2">${myWalletAddress}</span>
                            <button onclick="navigator.clipboard.writeText('${myWalletAddress}'); alert('მისამართი დაკოპირდა!')" class="text-xs text-amber-500 hover:underline">კოპირება</button>
                        </div>
                        <form onsubmit="handleDepositSubmit(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-400 mb-1">თანხა (USDT)</label>
                                <input type="number" min="10" id="depAmount" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500" placeholder="100">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-400 mb-1">TXID (ტრანზაქციის ჰეში)</label>
                                <input type="text" id="depTxid" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500" placeholder="e.g. 7f9b8...">
                            </div>
                            <button type="submit" class="w-full gold-gradient-bg text-black font-bold py-3 rounded-xl hover:brightness-110 transition text-sm">
                                დადასტურების მოთხოვნა
                            </button>
                        </form>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }

        function openWithdrawModal() {
            alert("გატანის ფანჯარა მალე დაემატება.");
        }

        function closeModal() {
            const overlay = document.getElementById('modalOverlay');
            if (overlay) overlay.remove();
        }

        async function handleDepositSubmit(e) {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('depAmount').value);
            const txid = document.getElementById('depTxid'].value;

            const { error } = await db.from('transactions').insert({
                user_id: currentUser.id,
                type: 'deposit',
                amount: amount,
                txid: txid,
                status: 'pending'
            });

            if (error) alert(error.message);
            else {
                alert("მოთხოვნა გაგზავნილია! ადმინისტრატორი შეამოწმებს ტრანზაქციას.");
                closeModal();
            }
        }

        function buyPackage(minAmount) {
            alert(`პაკეტის ასარჩევად საჭიროა მინიმუმ $${minAmount} დეპოზიტი.`);
        }
    </script>
</body>
</html>
