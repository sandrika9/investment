        body {

            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

        .glass-card:hover {
            border-color: rgba(245, 158, 11, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .gold-gradient-text {
            background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 50%, #D97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-gradient-bg {

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

            background: rgba(17, 24, 39, 0.5);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(75, 85, 99, 0.5);
            border-radius: 3px;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.3); }
            50% { box-shadow: 0 0 30px rgba(245, 158, 11, 0.6); }
        }
        .case-opening-box {
            animation: pulse-glow 1.5s infinite;
        }

        .case-spinner-container {
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 130px;
            background: rgba(3, 7, 18, 0.9);
            border-radius: 1rem;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        .case-spinner-pointer {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 4px;
            background: #F59E0B;
            transform: translateX(-50%);
            z-index: 20;
            box-shadow: 0 0 12px #F59E0B;
        }
        .case-spinner-pointer::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 10px solid #F59E0B;
        }
        .case-spinner-track {
            display: flex;
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            will-change: transform;
        }
        .case-item-card {
            min-width: 120px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding: 0 10px;
        }

                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">პაროლი</label>

                                <i class="fa-solid fa-lock absolute left-4 top-3.5 text-gray-500"></i>

        async function handleAuth(e, isSignUp) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (isSignUp) {
                const fullName = document.getElementById('fullName').value;
                const refCode = document.getElementById('refCode').value || localStorage.getItem('invited_by') || null;

                const { data, error } = await db.auth.signUp({
                    email,
                    password,
                    options: { data: { full_name: fullName, referred_by: refCode } }
                });

                if (error) alert(error.message);
                else {
                    localStorage.removeItem('invited_by');
                    alert("რეგისტრაცია წარმატებით გაიარე!");
                    location.reload();
                }
            } else {
                const { data, error } = await db.auth.signInWithPassword({ email, password });
                if (error) alert(error.message);
                else location.reload();
            }
        }

                            <span id="claimTimerDisplay" class="text-xs text-gray-400">${canClaim ? 'ქეისი ხელმისაწვდომია!' : 'მომდევნო ქეისი მალე'}</span>
                            <button id="claimCaseMainBtn" onclick="openCaseClaimModal()" ${!canClaim || userPackagesList.length === 0 ? 'disabled' : ''} class="${canClaim && userPackagesList.length > 0 ? 'bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 hover:bg-emerald-500 hover:text-black shadow-emerald-500/10' : 'bg-gray-800 text-gray-500 border border-gray-700 cursor-not-allowed'} font-semibold px-3 py-1.5 rounded-lg text-xs transition shadow-lg">
                                ${canClaim ? 'ქეისის გახსნა' : 'ლოდინი...'}
                            </button>
                        </div>
                    </div>

                    <div class="glass-card p-6 rounded-2xl">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">რეფერალური შემოსავალი</p>
                                <h3 class="text-3xl font-extrabold font-display text-blue-400 mt-2">$${(userProfile?.referral_earnings || 0).toFixed(2)}</h3>
                            </div>
                            <div class="w-12 h-12 rounded-xl bg-blue-500/10 text-blue-400 flex items-center justify-center text-xl">
                                <i class="fa-solid fa-user-plus"></i>
                            </div>
                        </div>
                        <p class="text-xs text-gray-500 mt-6"><i class="fa-solid fa-percent text-gray-600 mr-1"></i> 5% ბონუსი მეგობრებისგან</p>
                    </div>
                </div>

                <div class="glass-panel p-6 rounded-2xl border border-gray-800">
                    <h3 class="text-lg font-bold font-display text-white mb-4">ჩემი აქტიური პაკეტები</h3>
                    ${!userPackagesList || userPackagesList.length === 0 ? `
                        <p class="text-sm text-gray-400 text-center py-6">აქტიური პაკეტები არ გაქვს. გადადი პაკეტების გვერდზე და გააქტიურე.</p>
                    ` : `
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${userPackagesList.map(up => `
                                <div class="bg-gray-900/60 p-4 rounded-xl border border-gray-800 flex justify-between items-center">
                                    <div>
                                        <h4 class="font-bold text-white">${up.package_name}</h4>
                                        <p class="text-xs text-gray-400 mt-1">ინვესტიცია: <span class="text-amber-400 font-semibold">$${up.amount}</span></p>
                                    </div>
                                    <span class="px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">აქტიურია</span>
                                </div>
                            `).join('')}
                        </div>
                    `}
                </div>
            `;

            if (!canClaim && remainingMs > 0) {
                startCountdownTimer(remainingMs);
            }
        }

        function startCountdownTimer(durationMs) {
            let timeLeft = durationMs;
            const timerDisplay = document.getElementById('claimTimerDisplay');
            const claimBtn = document.getElementById('claimCaseMainBtn');

            const interval = setInterval(() => {
                timeLeft -= 1000;
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    if (timerDisplay) timerDisplay.innerText = 'ქეისი ხელმისაწვდომია!';
                    if (claimBtn && userPackagesList.length > 0) {
                        claimBtn.disabled = false;
                        claimBtn.className = 'bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 hover:bg-emerald-500 hover:text-black shadow-emerald-500/10 font-semibold px-3 py-1.5 rounded-lg text-xs transition shadow-lg';
                        claimBtn.innerText = 'ქეისის გახსნა';
                    }
                    return;
                }

                const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

                if (timerDisplay) {
                    timerDisplay.innerText = `შემდეგი ქეისი: ${hours}სთ ${minutes}წთ ${seconds}წმ`;
                }
            }, 1000);
        }

        function openCaseClaimModal() {
            if (!userPackagesList || userPackagesList.length === 0) {
                alert("შემოსავლის მისაღებად საჭიროა გქონდეს აქტიური პაკეტი!");
                return;
            }

            const lastClaim = userProfile?.last_claim_at ? new Date(userProfile.last_claim_at) : null;
            const now = new Date();

            if (lastClaim) {
                const diffMs = now - lastClaim;
                const sixHoursMs = 6 * 60 * 60 * 1000;
                if (diffMs < sixHoursMs) {
                    alert("ქეისის გასახსნელად ჯერ არ გასულა 6 საათიანი ინტერვალი!");
                    return;
                }
            }

            let totalDailySum = 0;
            userPackagesList.forEach(up => {
                const matchedPkg = AVAILABLE_PACKAGES.find(p => p.name.trim().toLowerCase() === up.package_name.trim().toLowerCase());
                if (matchedPkg) {
                    totalDailySum += matchedPkg.daily;
                } else {
                    totalDailySum += 1.0;
                }
            });

            const baseSixHourAmount = totalDailySum / 4;

            const modalHtml = `
                <div id="caseModalOverlay" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
                    <div class="glass-panel max-w-xl w-full p-8 rounded-2xl border border-amber-500/40 text-center case-opening-box">
                        <div class="w-14 h-14 rounded-2xl bg-amber-500/20 text-amber-400 flex items-center justify-center mx-auto text-xl mb-3">
                            <i class="fa-solid fa-box-open animate-bounce"></i>
                        </div>
                        <h3 class="text-xl font-bold text-white mb-1 font-display">6-საათიანი ქეისის გახსნა</h3>
                        <p class="text-xs text-gray-400 mb-6">ამოიღე შენი ბონუს მულტიპლიკატორი (Common 1.0x, Rare 1.5x, Epic 2.0x, Legendary 3.0x)!</p>
                        
                        <div class="case-spinner-container mb-6 shadow-inner">
                            <div class="case-spinner-pointer"></div>
                            <div id="spinnerTrack" class="case-spinner-track"></div>
                        </div>

                        <div id="caseResultInfo" class="text-sm font-semibold text-gray-400 uppercase tracking-widest mb-6 h-6">
                            მზადაა გასახსნელად
                        </div>

                        <button id="spinCaseBtn" onclick="spinAndClaimCase(${baseSixHourAmount})" class="w-full gold-gradient-bg text-black font-bold py-3.5 rounded-xl transition text-sm shadow-lg shadow-amber-500/20">
                            ქეისის დატრიალება
                        </button>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            buildSpinnerItems(baseSixHourAmount);
        }

        function buildSpinnerItems(baseAmount) {
            const track = document.getElementById('spinnerTrack');
            if (!track) return;

            const itemTemplates = [
                { name: 'Common', mult: 1.0, color: 'text-gray-400 bg-gray-800/40 border-gray-700' },
                { name: 'Rare', mult: 1.5, color: 'text-blue-400 bg-blue-950/40 border-blue-500/40' },
                { name: 'Epic', mult: 2.0, color: 'text-purple-400 bg-purple-950/40 border-purple-500/40' },
                { name: 'Legendary', mult: 3.0, color: 'text-amber-400 bg-amber-950/40 border-amber-500/40' }
            ];

            let html = '';
            window.generatedSpinItems = [];
            for (let i = 0; i < 60; i++) {
                const randTmpl = itemTemplates[Math.floor(Math.random() * itemTemplates.length)];
                window.generatedSpinItems.push(randTmpl);
                html += `
                    <div class="case-item-card border ${randTmpl.color}">
                        <span class="text-[10px] uppercase font-bold tracking-wider">${randTmpl.name}</span>
                        <span class="text-lg font-ext500 font-display mt-1">$${(baseAmount * randTmpl.mult).toFixed(2)}</span>
                        <span class="text-[10px] opacity-70">(${randTmpl.mult}x)</span>
                    </div>
                `;
            }
            track.innerHTML = html;
            track.style.transform = `translateX(0px)`;
        }

        async function spinAndClaimCase(baseAmount) {
            const btn = document.getElementById('spinCaseBtn');
            const track = document.getElementById('spinnerTrack');
            const info = document.getElementById('caseResultInfo');
            if (btn) btn.disabled = true;

            const rand = Math.random() * 100;
            let winningTmpl;
            if (rand < 60) winningTmpl = { name: 'Common (60%)', mult: 1.0, color: 'text-gray-400' };
            else if (rand < 85) winningTmpl = { name: 'Rare (25%)', mult: 1.5, color: 'text-blue-400' };
            else if (rand < 97) winningTmpl = { name: 'Epic (12%)', mult: 2.0, color: 'text-purple-400' };
            else winningTmpl = { name: 'Legendary (3%) 🔥', mult: 3.0, color: 'text-amber-400' };

            window.generatedSpinItems[45] = winningTmpl;
            const cardWidth = 120;
            const targetPixelOffset = (45 * cardWidth) - (520 / 2) + (cardWidth / 2) + (Math.random() * 40 - 20);

            track.style.transition = 'transform 4s cubic-bezier(0.15, 0.85, 0.15, 1)';
            track.style.transform = `translateX(-${targetPixelOffset}px)`;

            const finalReward = baseAmount * winningTmpl.mult;

            setTimeout(async () => {
                if (info) {
                    info.innerHTML = `<span class="${winningTmpl.color} font-bold text-base">მოვლენა: ${winningTmpl.name} ($${finalReward.toFixed(2)})</span>`;
                }
                await finalizeClaim(finalReward, winningTmpl.name);
            }, 4200);
        }

        async function finalizeClaim(rewardAmount, rarityName) {
            const newBal = (userProfile?.balance || 0) + rewardAmount;
            const newTotalEarned = (userProfile?.total_earned || 0) + rewardAmount;
            const nowIso = new Date().toISOString();

            await db.from('profiles').update({ 
                balance: newBal, 
                total_earned: newTotalEarned,
                last_claim_at: nowIso
            }).eq('id', currentUser.id);

            await fetchProfile();

            setTimeout(() => {
                const overlay = document.getElementById('caseModalOverlay');
                if (overlay) overlay.remove();
                alert(`გილოცავ! შენ ამოიღე [${rarityName}] და მიიღე $${rewardAmount.toFixed(2)} შენი ქეისიდან.`);
                loadDashboardTab();
            }, 1800);
        }

        function loadPackagesTab() {
            const content = document.getElementById('tabContent');

            content.innerHTML = `
                <div class="mb-6">
                    <h2 class="text-xl font-bold font-display text-white">საინვესტიციო პაკეტები</h2>
                    <p class="text-sm text-gray-400 mt-1">აირჩიე შენზე მორგებული პაკეტი და მიიღე შემოსავალი ყოველ 6 საათში</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    ${AVAILABLE_PACKAGES.map(p => {
                        const isAlreadyActive = userPackagesList.some(up => up.package_name && up.package_name.trim().toLowerCase() === p.name.trim().toLowerCase());
                        return `
                            <div class="glass-card p-6 rounded-2xl relative border border-gray-800 flex flex-col justify-between">
                                <div>
                                    <div class="flex justify-between items-center mb-3">
                                        <h3 class="text-xl font-bold text-white">${p.name}</h3>

                                    </div>
                                    
                                    <div class="w-full h-2 rounded-full bg-gradient-to-r ${p.color} mb-4"></div>
                                    <p class="text-xs text-gray-400 mt-2 min-h-[36px]">${p.desc}</p>
                                    
                                    <div class="mt-4 mb-6 bg-gray-900/50 p-3 rounded-xl border border-gray-800/80">
                                        <div class="flex justify-between items-center text-sm">
                                            <span class="text-gray-400">დღიური შემოსავალი:</span>
                                            <span class="text-emerald-400 font-bold font-display">$${p.daily}</span>
                                        </div>
                                    </div>

                                    <ul class="space-y-2 text-xs text-gray-300 border-t border-gray-800/80 pt-4 mb-6">
                                        <li class="flex justify-between"><span class="text-gray-500">6-სთ ქეისის წილი:</span> <span class="font-semibold text-amber-400">$${(p.daily / 4).toFixed(2)}</span></li>
                                        <li class="flex justify-between"><span class="text-gray-500">გადახდა:</span> <span class="font-semibold">ყოველ 6 საათში (4-ჯერ დღეში)</span></li>
                                    </ul>
                                </div>
                                <button onclick="openBuyPackageModal('${p.name}', ${p.price})" ${isAlreadyActive ? 'disabled' : ''} class="w-full ${isAlreadyActive ? 'bg-gray-800 text-gray-500 border border-gray-700 cursor-not-allowed' : 'gold-gradient-bg text-black font-bold'} py-3 rounded-xl transition text-sm shadow-md">
                                    ${isAlreadyActive ? 'პაკეტი აქტიურია' : 'პაკეტის შეძენა'}
                                </button>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function openBuyPackageModal(packageName, price) {
            const modalHtml = `
                <div id="buyModalOverlay" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
                    <div class="glass-panel max-w-md w-full p-8 rounded-2xl border border-gray-800">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-lg font-bold text-white">${packageName}</h3>
                            <button onclick="document.getElementById('buyModalOverlay').remove()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <p class="text-xs text-gray-400 mb-4">პაკეტის ღირებულება შეადგენს: <span class="text-amber-400 font-bold text-sm">$${price}</span></p>
                        <button onclick="confirmBuyPackage('${packageName}', ${price})" class="w-full gold-gradient-bg text-black font-bold py-3.5 rounded-xl transition text-sm shadow-lg shadow-amber-500/20">
                            დადასტურება და შეძენა
                        </button>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }

        async function confirmBuyPackage(packageName, price) {
            if ((userProfile?.balance || 0) < price) {
                alert("ბალანსზე არ გაქვს საკმარისი თანხა! ჯერ გააკეთე დეპოზიტი.");
                return;
            }

            const newBalance = userProfile.balance - price;
            await db.from('profiles').update({ balance: newBalance }).eq('id', currentUser.id);
            await db.from('user_packages').insert([{
                user_id: currentUser.id,
                package_name: packageName,
                amount: price,
                status: 'active'
            }]);

            document.getElementById('buyModalOverlay').remove();
            alert("პაკეტი წარმატებით გააქტიურდა!");
            await fetchProfile();
            await fetchUserPackages();
            switchTab('dashboard');
        }
