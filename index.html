<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capital Investment Platform - Case Opening Edition</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#0B0F19',
                            card: '#111827',
                            border: '#1F2937',
                            accent: '#3B82F6',
                            gold: '#F59E0B',
                            goldHover: '#D97706',
                            green: '#10B981',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #07090E;
            color: #F3F4F6;
            font-family: 'Inter', sans-serif;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.08) 0%, transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(245, 158, 11, 0.05) 0%, transparent 25%);
            background-attachment: fixed;
        }

        .glass-panel {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card {
            background: linear-gradient(135deg, rgba(31, 41, 55, 0.6) 0%, rgba(17, 24, 39, 0.8) 100%);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(245, 158, 11, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .gold-gradient-text {
            background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 50%, #D97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-gradient-bg {
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(17, 24, 39, 0.5);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(75, 85, 99, 0.5);
            border-radius: 3px;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.3); }
            50% { box-shadow: 0 0 30px rgba(245, 158, 11, 0.6); }
        }
        .case-opening-box {
            animation: pulse-glow 1.5s infinite;
        }

        .case-spinner-container {
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 130px;
            background: rgba(3, 7, 18, 0.9);
            border-radius: 1rem;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        .case-spinner-pointer {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 4px;
            background: #F59E0B;
            transform: translateX(-50%);
            z-index: 20;
            box-shadow: 0 0 12px #F59E0B;
        }
        .case-spinner-pointer::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 10px solid #F59E0B;
        }
        .case-spinner-track {
            display: flex;
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            will-change: transform;
            transition: transform 5s cubic-bezier(0.15, 0.9, 0.2, 1);
        }
        .case-item-card {
            min-width: 120px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding: 0 10px;
            box-sizing: border-box;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between custom-scrollbar">

    <!-- TOP NAVIGATION -->
    <nav class="glass-panel sticky top-0 z-50 border-b border-gray-800/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl gold-gradient-bg flex items-center justify-center shadow-lg shadow-amber-500/20">
                        <i class="fa-solid fa-chart-line text-black font-bold text-xl"></i>
                    </div>
                    <div>
                        <span class="font-display font-bold text-xl tracking-tight text-white block">CAPITAL<span class="gold-gradient-text">INV</span></span>
                        <span class="text-[10px] text-gray-400 tracking-widest uppercase block -mt-1">VIP Rewards Platform</span>
                    </div>
                </div>

                <div id="navRight" class="flex items-center space-x-4"></div>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTAINER -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        <div id="appContainer"></div>
    </main>

    <!-- FOOTER -->
    <footer class="glass-panel border-t border-gray-800/60 py-6 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm text-gray-500 flex flex-col sm:flex-row justify-between items-center gap-4">
            <p>© 2026 Capital Investment Platform. All rights reserved.</p>
            <div class="flex space-x-6 text-gray-400">
                <a href="#" class="hover:text-amber-500 transition"><i class="fa-brands fa-telegram text-lg"></i></a>
                <a href="#" class="hover:text-amber-500 transition"><i class="fa-brands fa-twitter text-lg"></i></a>
                <a href="#" class="hover:text-amber-500 transition"><i class="fa-solid fa-headset text-lg"></i></a>
            </div>
        </div>
    </footer>

    <!-- JS SCRIPT CORE -->
    <script>
        const SUPABASE_URL = "https://gnzhgavbvkjvoeslrlns.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_e84AiBuFrqji-bPqqbsbaA_woYYU8dx";
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let userProfile = null;
        let activeTab = 'dashboard';
        let userPackagesList = [];
        let spinnerItemsData = [];

        const AVAILABLE_PACKAGES = [
            { id: 'Little Investor', name: 'Little Investor', price: 20, daily: 0.99, desc: 'იდეალური სტარტი დამწყებთათვის.', color: 'from-blue-500/20 to-indigo-500/5' },
            { id: '9-5 Job', name: '9-5 Job', price: 60, daily: 3.99, desc: 'გამოიმუშავე ყოველდღიურად ბონუსები.', color: 'from-cyan-500/20 to-blue-500/5' },
            { id: 'Normal Investor', name: 'Normal Investor', price: 199, daily: 22.90, desc: 'მყარი პაკეტი სერიოზული ზრდისთვის.', color: 'from-amber-500/20 to-orange-500/5' },
            { id: 'Big Boy', name: 'Big Boy', price: 399, daily: 44.90, desc: 'მაღალი ბონუსები და პრიორიტეტული წვდომა.', color: 'from-purple-500/20 to-pink-500/5' },
            { id: 'Boss', name: 'Boss', price: 999, daily: 119.00, desc: 'ელიტარული სტატუსი მაქსიმალური პრივილეგიებით.', color: 'from-emerald-500/20 to-teal-500/5' }
        ];

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const { data: { session } } = await db.auth.getSession();
                if (session) {
                    currentUser = session.user;
                    await fetchProfile();
                    await fetchUserPackages();
                    renderMainDashboard();
                } else {
                    renderAuthPage(false);
                }
            } catch (err) {
                console.error("Initialization error:", err);
                renderAuthPage(false);
            }
        });

        async function fetchProfile() {
            if (!currentUser) return;
            const { data } = await db.from('profiles').select('*').eq('id', currentUser.id).single();
            if (data) userProfile = data;
        }

        async function fetchUserPackages() {
            if (!currentUser) return;
            const { data, error } = await db.from('user_packages').select('*').eq('user_id', currentUser.id);
            userPackagesList = error ? [] : (data || []);
        }

        function renderAuthPage(isSignUp = false) {
            const navRight = document.getElementById('navRight');
            navRight.innerHTML = `
                <button onclick="renderAuthPage(false)" class="text-sm font-medium text-gray-300 hover:text-white px-3 py-2">შესვლა</button>
                <button onclick="renderAuthPage(true)" class="text-sm font-semibold text-black gold-gradient-bg px-4 py-2 rounded-lg hover:brightness-110 transition shadow-md">რეგისტრაცია</button>
            `;

            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="max-w-md mx-auto my-12 glass-panel p-8 rounded-2xl shadow-2xl border border-gray-800">
                    <div class="text-center mb-8">
                        <h2 class="text-2xl font-bold font-display text-white">${isSignUp ? 'ანგარიშის შექმნა' : 'ავტორიზაცია'}</h2>
                    </div>
                    <form onsubmit="handleAuth(event, ${isSignUp})" class="space-y-5">
                        ${isSignUp ? `
                            <div>
                                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">სრული სახელი</label>
                                <input type="text" id="fullName" required class="w-full bg-gray-900 border border-gray-700 rounded-xl py-3 px-4 text-white text-sm">
                            </div>
                        ` : ''}
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">ელ.ფოსტა</label>
                            <input type="email" id="email" required class="w-full bg-gray-900 border border-gray-700 rounded-xl py-3 px-4 text-white text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">პაროლი</label>
                            <input type="password" id="password" required class="w-full bg-gray-900 border border-gray-700 rounded-xl py-3 px-4 text-white text-sm">
                        </div>
                        <button type="submit" class="w-full gold-gradient-bg text-black font-bold py-3.5 rounded-xl transition text-sm">
                            ${isSignUp ? 'რეგისტრაცია' : 'შესვლა'}
                        </button>
                    </form>
                </div>
            `;
        }

        async function handleAuth(e, isSignUp) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (isSignUp) {
                const fullName = document.getElementById('fullName').value;
                const { error } = await db.auth.signUp({ email, password, options: { data: { full_name: fullName } } });
                if (error) alert(error.message);
                else { alert("რეგისტრაცია წარმატებით გაიარე!"); location.reload(); }
            } else {
                const { error } = await db.auth.signInWithPassword({ email, password });
                if (error) alert(error.message);
                else location.reload();
            }
        }

        async function handleLogout() {
            await db.auth.signOut();
            location.reload();
        }

        function renderMainDashboard() {
            const navRight = document.getElementById('navRight');
            navRight.innerHTML = `
                <div class="flex items-center space-x-3 bg-gray-900/80 border border-gray-800 px-3 py-1.5 rounded-xl">
                    <span class="text-sm font-medium text-gray-200">${userProfile?.full_name || currentUser.email}</span>
                </div>
                <button onclick="handleLogout()" class="text-gray-400 hover:text-red-400 p-2"><i class="fa-solid fa-right-from-bracket"></i></button>
            `;

            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="glass-panel p-6 rounded-2xl border border-gray-800 mb-8">
                    <h3 class="text-xl font-bold text-white mb-2">მოგესალმებით, ${userProfile?.full_name || 'მომხმარებელო'}</h3>
                    <p class="text-gray-400 text-sm">ბალანსი: <span class="text-amber-400 font-bold">$${(userProfile?.balance || 0).toFixed(2)}</span></p>
                    <button onclick="openCaseClaimModal()" class="mt-4 bg-amber-500 text-black font-bold px-4 py-2 rounded-xl">ქეისის გახსნა</button>
                </div>
            `;
        }

        function openCaseClaimModal() {
            const baseAmount = 5.0; // საბაზო ბონუს თანხა

            const modalHtml = `
                <div id="caseModalOverlay" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
                    <div class="glass-panel max-w-xl w-full p-8 rounded-2xl border border-amber-500/40 text-center case-opening-box relative">
                        <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
                        <div class="w-14 h-14 rounded-2xl bg-amber-500/20 text-amber-400 flex items-center justify-center mx-auto text-xl mb-3">
                            <i class="fa-solid fa-box-open animate-bounce"></i>
                        </div>
                        <h3 class="text-xl font-bold text-white mb-1 font-display">6-საათიანი ქეისის გახსნა</h3>
                        <p class="text-xs text-gray-400 mb-6">ამოიღე შენი ბონუს მულტიპლიკატორი!</p>
                        
                        <div class="case-spinner-container mb-6 shadow-inner">
                            <div class="case-spinner-pointer"></div>
                            <div id="spinnerTrack" class="case-spinner-track"></div>
                        </div>

                        <div id="caseResultInfo" class="text-sm font-semibold text-gray-400 uppercase tracking-widest mb-6 h-6">
                            მზადაა გასახსნელად
                        </div>

                        <button id="spinCaseBtn" onclick="spinAndClaimCase(${baseAmount})" class="w-full gold-gradient-bg text-black font-bold py-3.5 rounded-xl transition text-sm shadow-lg shadow-amber-500/20">
                            ქეისის დატრიალება
                        </button>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            buildSpinnerItems(baseAmount);
        }

        function closeModal() {
            const modal = document.getElementById('caseModalOverlay');
            if (modal) modal.remove();
        }

        // --- დასრულებული buildSpinnerItems და Spin ლოგიკა ---
        function buildSpinnerItems(baseAmount) {
            const track = document.getElementById('spinnerTrack');
            if (!track) return;

            const multipliers = [
                { mult: 1.0, label: 'Common', color: 'text-gray-400', bg: 'bg-gray-800/40' },
                { mult: 1.2, label: 'Common', color: 'text-gray-300', bg: 'bg-gray-800/50' },
                { mult: 1.5, label: 'Rare', color: 'text-blue-400', bg: 'bg-blue-900/30' },
                { mult: 2.0, label: 'Epic', color: 'text-purple-400', bg: 'bg-purple-900/30' },
                { mult: 3.0, label: 'Legendary', color: 'text-amber-400', bg: 'bg-amber-900/30' }
            ];

            spinnerItemsData = [];
            let htmlContent = '';

            // 60 ელემენტის გენერირება რულეტკის ეფექტისთვის
            for (let i = 0; i < 60; i++) {
                const randomItem = multipliers[Math.floor(Math.random() * multipliers.length)];
                const calculatedValue = (baseAmount * randomItem.mult).toFixed(2);
                
                spinnerItemsData.push({ ...randomItem, value: calculatedValue });

                htmlContent += `
                    <div class="case-item-card ${randomItem.bg}">
                        <span class="text-[10px] font-bold uppercase tracking-wider ${randomItem.color}">${randomItem.label}</span>
                        <span class="text-lg font-extrabold text-white my-1">${randomItem.mult}x</span>
                        <span class="text-xs font-semibold text-emerald-400">$${calculatedValue}</span>
                    </div>
                `;
            }

            track.innerHTML = htmlContent;
        }

        async function spinAndClaimCase(baseAmount) {
            const spinBtn = document.getElementById('spinCaseBtn');
            const track = document.getElementById('spinnerTrack');
            const resultInfo = document.getElementById('caseResultInfo');
            
            if (!spinBtn || !track) return;

            spinBtn.disabled = true;
            spinBtn.classList.add('opacity-50', 'cursor-not-allowed');

            // გამარჯვებული ინდექსის შერჩევა (დაახლოებით 45-ედან 55-ე პოზიციამდე)
            const winningIndex = Math.floor(Math.random() * 10) + 45;
            const itemWidth = 120; // case-item-card min-width
            const containerWidth = track.parentElement.clientWidth;
            
            // ცენტრში გასწორების გამოთვლა
            const targetX = (winningIndex * itemWidth) - (containerWidth / 2) + (itemWidth / 2);

            track.style.transform = `translateX(-${targetX}px)`;
            resultInfo.innerText = "ქეისი ტრიალებს...";

            // 5 წამიანი ანიმაციის დასრულების შემდეგ
            setTimeout(async () => {
                const wonItem = spinnerItemsData[winningIndex];
                resultInfo.innerHTML = `<span class="${wonItem.color} font-bold">მოგებულია: $${wonItem.value} (${wonItem.mult}x)</span>`;

                // ბალანსის განახლება Supabase-ში
                if (currentUser) {
                    const newBalance = (userProfile?.balance || 0) + parseFloat(wonItem.value);
                    const { error } = await db.from('profiles').update({
                        balance: newBalance,
                        last_claim_at: new Date().toISOString()
                    }).eq('id', currentUser.id);

                    if (!error) {
                        if (userProfile) userProfile.balance = newBalance;
                        setTimeout(() => {
                            closeModal();
                            renderMainDashboard();
                        }, 2000);
                    }
                }
            }, 5000);
        }
    </script>
</body>
</html>
